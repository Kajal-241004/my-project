<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>कृषि साथी (Krishi Saathi) - AI Kisan Dost | Powered by Gemini AI</title>
  
  <!-- Favicon / Agri Icons -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
  
  <!-- Google Fonts: Poppins & Noto Sans Devanagari for clean Hindi typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            farmer: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
              dark: '#052e16',
            },
            amberKisan: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f',
            },
            soil: {
              50: '#fdf8f4',
              100: '#f8eee6',
              700: '#694125',
              800: '#4f301b',
              900: '#341f11',
            }
          },
          fontFamily: {
            sans: ['"Noto Sans Devanagari"', 'Poppins', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-gentle': 'bounceGentle 2s infinite',
            'ripple': 'ripple 1.5s cubic-bezier(0, 0.2, 0.8, 1) infinite',
          },
          keyframes: {
            bounceGentle: {
              '0%, 100%': { transform: 'translateY(-3%)' },
              '50%': { transform: 'translateY(0)' },
            },
            ripple: {
              '0%': { transform: 'scale(0.8)', opacity: '1' },
              '100%': { transform: 'scale(2.2)', opacity: '0' },
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbar & Farmer Mobile Styling */
    * {
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
      background: #f4f7f4;
      margin: 0;
      padding: 0;
      color: #1a2e1a;
      overflow-x: hidden;
    }
    /* Hide scrollbar for tabs */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Touch friendly active feedback */
    .touch-btn:active {
      transform: scale(0.97);
    }
    /* Glassmorphism for mobile header */
    .glass-header {
      background: rgba(22, 163, 74, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    /* Wave decoration */
    .wave-bg {
      background: linear-gradient(135deg, #15803d 0%, #16a34a 60%, #eab308 100%);
    }
  </style>
</head>
<body class="bg-gradient-to-b from-farmer-50 via-amberKisan-50/30 to-farmer-100 min-h-screen">
  <div id="root">
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center p-6">
        <div class="w-16 h-16 border-4 border-farmer-600 border-t-amber-400 rounded-full animate-spin mx-auto mb-4"></div>
        <h2 class="text-xl font-bold text-farmer-800">कृषि साथी लोड हो रहा है...</h2>
        <p class="text-sm text-gray-600 mt-1">हर कदम किसान के साथ | Powered by Gemini AI</p>
      </div>
    </div>
  </div>

  <!-- Load Main Application Script -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
